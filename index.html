<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giáo trình PDF + Audio</title>
<style>
:root{--bg:#f4f4f2;--panel:#fff;--text:#1d1d1b;--mut:#6b6b66;--line:#d8d8d2;--acc:#2f6fed;--accs:#e6eeff;--ok:#1f9d55}
@media (prefers-color-scheme:dark){:root{--bg:#18181a;--panel:#232326;--text:#ececea;--mut:#9a9a94;--line:#3a3a3e;--acc:#6b9bff;--accs:#26324d;--ok:#4cc48a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.menu{display:none}
.main{flex:1;display:flex;min-height:0}
aside{width:260px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside h4{margin:0;padding:8px 10px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line)}
#list{overflow:auto;flex:1}
.it{padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:6px;align-items:center;word-break:break-all}
.it.cur{background:var(--accs)}
.it .d{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.it.has .d{background:var(--ok)}
.it .pg{margin-left:auto;color:var(--mut);font-size:12px;flex:none}
.stage{flex:1;overflow:auto;position:relative;touch-action:pan-x pan-y}
#empty{padding:40px 20px;text-align:center;color:var(--mut)}
#pages{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px;width:max-content;min-width:100%}
.pgx{position:relative;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.25);flex:none}
.pgx canvas{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0;pointer-events:none}
.mk{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 1px 5px rgba(0,0,0,.4);cursor:pointer;user-select:none;pointer-events:auto;border:2px solid #fff}
.mk.pl{background:var(--ok);animation:p 1s infinite}
.mk small{position:absolute;top:-9px;right:-9px;background:#222;color:#fff;border-radius:8px;font-size:10px;padding:0 4px;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes p{50%{box-shadow:0 0 0 7px rgba(31,157,85,.25)}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:8px 14px;border-radius:8px;z-index:20;max-width:92vw;display:none;font-size:13px;box-shadow:0 3px 14px rgba(0,0,0,.4)}
@media (max-width:700px){
 .menu{display:inline-block}
 aside{position:fixed;left:0;top:0;bottom:0;width:82vw;max-width:340px;z-index:7;transform:translateX(-102%);transition:transform .2s;box-shadow:2px 0 14px rgba(0,0,0,.35)}
 body.list aside{transform:none}
 .it{padding:12px 10px}
}
</style>
</head>
<body>
<div class="bar">
 <button class="menu" id="bMenu">☰</button>
 <button id="bAll" class="on">📂 Mở 3 file</button>
 <button id="bFit" title="Vừa chiều ngang màn hình">⛶</button>
</div>
<div class="main">
 <aside>
  <h4 id="ah">Danh sách audio</h4>
  <div id="list"></div>
 </aside>
 <div class="stage" id="stage"><div id="empty">Bấm <b>📂 Mở 3 file</b> rồi chọn PDF, ZIP âm thanh và JSON.</div><div id="pages"></div></div>
</div>
<input type="file" id="fm" multiple style="display:none">
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const WURL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
async function initWorker(){
 try{
  const r=await fetch(WURL);if(!r.ok)throw 0;
  pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([await r.text()],{type:'text/javascript'}));
 }catch(e){
  await new Promise(ok=>{const sc=document.createElement('script');sc.src=WURL;sc.onload=ok;sc.onerror=ok;document.head.appendChild(sc)});
  pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';
 }
}
const workerReady=initWorker();
let pdf=null,scale=1.3,cur=null,playing=null;
let files=new Map(),marks={},names=[],pages=[],vis=new Set(),io=null;
const au=new Audio(),stage=$('stage'),pgs=$('pages');
const nat=(a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'});
function toast(m,ms){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);if(ms!==0)toast.t=setTimeout(()=>t.style.display='none',ms||6000)}

const AUD=/\.(mp3|m4a|wav|ogg|oga|aac|flac|opus)$/i;
const MIME={mp3:'audio/mpeg',m4a:'audio/mp4',wav:'audio/wav',ogg:'audio/ogg',oga:'audio/ogg',aac:'audio/aac',flac:'audio/flac',opus:'audio/ogg'};
let pdfName='audio';
function toast(m,ms){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);if(ms!==0)toast.t=setTimeout(()=>t.style.display='none',ms||6000)}

// ===== Đọc ZIP theo kiểu "lười": chỉ đọc danh sách, giải nén từng bài khi bấm phát =====
async function readZip(file){
 const size=file.size,tl=Math.min(size,65557);
 const tail=new DataView(await file.slice(size-tl).arrayBuffer());
 let p=-1;
 for(let i=tl-22;i>=0;i--){if(tail.getUint32(i,true)===0x06054b50){p=i;break}}
 if(p<0)throw new Error('"'+file.name+'" không phải file ZIP hợp lệ');
 const cnt=tail.getUint16(p+10,true),cdSize=tail.getUint32(p+12,true),cdOff=tail.getUint32(p+16,true);
 if(cdOff===0xffffffff||cnt===0xffff)throw new Error('ZIP quá lớn (zip64) chưa được hỗ trợ, hãy chia nhỏ');
 const buf=await file.slice(cdOff,cdOff+cdSize).arrayBuffer();
 const dv=new DataView(buf),u8=new Uint8Array(buf),dec=new TextDecoder('utf-8');
 const out=new Map();let o=0;
 while(o+46<=dv.byteLength&&dv.getUint32(o,true)===0x02014b50){
  const method=dv.getUint16(o+10,true),csize=dv.getUint32(o+20,true);
  const nl=dv.getUint16(o+28,true),el=dv.getUint16(o+30,true),cl=dv.getUint16(o+32,true),lho=dv.getUint32(o+42,true);
  const name=dec.decode(u8.subarray(o+46,o+46+nl));
  o+=46+nl+el+cl;
  if(name.endsWith('/'))continue;
  const base=name.split('/').pop().normalize('NFC');
  if(base.startsWith('._')||!AUD.test(base))continue;
  out.set(base,{zip:true,file,method,csize,lho,type:MIME[base.split('.').pop().toLowerCase()]||'audio/mpeg',name:base});
 }
 return out;
}
async function zipBlob(en){
 const h=new DataView(await en.file.slice(en.lho,en.lho+30).arrayBuffer());
 const start=en.lho+30+h.getUint16(26,true)+h.getUint16(28,true);
 if(en.method===0)return en.file.slice(start,start+en.csize,en.type);
 if(en.method===8){
  if(typeof DecompressionStream==='undefined')throw new Error('trình duyệt chưa hỗ trợ giải nén, hãy nén ZIP ở chế độ Store');
  const ds=en.file.slice(start,start+en.csize).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Blob([await new Response(ds).arrayBuffer()],{type:en.type});
 }
 throw new Error('kiểu nén ZIP không hỗ trợ');
}


async function buildPages(){
 if(io)io.disconnect();
 pgs.innerHTML='';pages=[];vis.clear();
 const n=pdf.numPages,sizes=[];
 for(let i=1;i<=n;i+=40){
  const batch=[];
  for(let j=i;j<Math.min(n,i+39)+1;j++)batch.push(pdf.getPage(j).then(p=>{const v=p.getViewport({scale:1});sizes[j-1]=[v.width,v.height]}));
  await Promise.all(batch);
 }
 $('empty').style.display='none';
 scale=Math.min(3,Math.max(.5,(stage.clientWidth-24)/sizes[0][0]));
 io=new IntersectionObserver(es=>{
  es.forEach(e=>{const i=+e.target.dataset.i;if(e.isIntersecting)vis.add(i);else{vis.delete(i);clearPage(i)}});
  pump();
 },{root:stage,rootMargin:'700px 0px'});
 sizes.forEach((sz,i)=>{
  const el=document.createElement('div');el.className='pgx';el.dataset.i=i;
  const cv=document.createElement('canvas'),ov=document.createElement('div');ov.className='ov';
  el.append(cv,ov);pgs.appendChild(el);
  pages.push({el,cv,ov,w:sz[0],h:sz[1],rs:0,lq:false});
 });
 sizePages();pages.forEach(P=>io.observe(P.el));
 stage.scrollTop=0;
}
function sizePages(){pages.forEach(P=>{P.el.style.width=P.w*scale+'px';P.el.style.height=P.h*scale+'px'})}
function clearPage(i){const P=pages[i];if(!P)return;P.cv.width=P.cv.height=0;P.rs=0;P.lq=false}

// ===== Vẽ trang theo hàng đợi ưu tiên: bản nhanh (mờ) trước, bản rõ nét sau =====
let busy=false,fast=false,lastY=0,lastT=0,dir=1,st=0;
const MAXPX=9e6;
function ratio(P){
 let r=Math.min(window.devicePixelRatio||1,2);
 const px=P.w*scale*P.h*scale;
 if(px*r*r>MAXPX)r=Math.sqrt(MAXPX/px);
 return r;
}
function nextJob(){
 const vh=stage.clientHeight,top=stage.scrollTop,mid=top+vh/2;
 let best=null,bs=Infinity;
 vis.forEach(i=>{
  const P=pages[i];if(!P)return;
  const t=pageTop(i),h=P.h*scale,c=t+h/2;
  const inView=t<top+vh&&t+h>top,near=t<top+vh*1.5&&t+h>top-vh*.5;
  let tier;
  if(P.rs===0)tier=inView?0:2;
  else if(P.lq||P.rs!==scale){if(fast)return;tier=inView?1:(near?3:-1)}
  else return;
  if(tier<0)return;
  const d=Math.abs(c-mid)*((c-mid)*dir>0?.6:1),sc=tier*1e7+d;
  if(sc<bs){bs=sc;best={i,low:P.rs===0}}
 });
 return best;
}
async function renderJob(j){
 const P=pages[j.i],sc=scale;
 const p=await pdf.getPage(j.i+1),vp=p.getViewport({scale:sc});
 let r=ratio(P);if(j.low)r*=.5;
 const oc=document.createElement('canvas');
 oc.width=Math.max(1,Math.round(vp.width*r));oc.height=Math.max(1,Math.round(vp.height*r));
 try{await p.render({canvasContext:oc.getContext('2d'),viewport:vp,transform:[r,0,0,r,0,0]}).promise}catch(e){return}
 if(vis.has(j.i)){
  P.cv.width=oc.width;P.cv.height=oc.height;
  P.cv.getContext('2d').drawImage(oc,0,0);
  P.rs=sc;P.lq=!!j.low;
 }
 oc.width=oc.height=0;
}
async function pump(){
 if(busy||!pdf)return;busy=true;
 try{
  for(let j;(j=nextJob());){
   await renderJob(j);
   await new Promise(ok=>setTimeout(ok,0));
  }
 }catch(e){}
 busy=false;
}
stage.addEventListener('scroll',()=>{
 const t=performance.now(),y=stage.scrollTop;
 if(t>lastT){if(y!==lastY)dir=y>lastY?1:-1;fast=Math.abs(y-lastY)/(t-lastT)>1.5}
 lastY=y;lastT=t;
 clearTimeout(st);st=setTimeout(()=>{fast=false;pump()},120);
 pump();
});

function pageTop(i){return pgs.offsetTop+pages[i].el.offsetTop}
function pageAtY(y){
 let lo=0,hi=pages.length-1;
 while(lo<hi){const m=(lo+hi+1)>>1;if(pageTop(m)<=y)lo=m;else hi=m-1}
 return lo;
}
function goPage(n){
 if(!pages.length)return;
 n=Math.min(Math.max(1,n),pages.length);
 stage.scrollTo({top:pageTop(n-1)-8});
}
function setScale(ns,cx,cy){
 if(!pages.length)return;
 ns=Math.min(4,Math.max(.3,ns));if(Math.abs(ns-scale)<1e-3)return;
 if(cx==null){cx=stage.clientWidth/2;cy=stage.clientHeight/3}
 const y=stage.scrollTop+cy,i=pageAtY(y),P=pages[i];
 const fy=(y-pageTop(i))/(P.h*scale);
 const fx=(stage.scrollLeft+cx-pgs.offsetLeft-P.el.offsetLeft)/(P.w*scale);
 scale=ns;sizePages();
 stage.scrollTop=pageTop(i)+fy*P.h*scale-cy;
 stage.scrollLeft=pgs.offsetLeft+P.el.offsetLeft+fx*P.w*scale-cx;
 pump();
}
$('bFit').onclick=()=>{
 if(!pages.length)return;
 setScale((stage.clientWidth-24)/pages[pageAtY(stage.scrollTop+stage.clientHeight/3)].w);
};
stage.addEventListener('wheel',e=>{
 if(!e.ctrlKey)return;
 e.preventDefault();
 const b=stage.getBoundingClientRect();
 setScale(scale*(e.deltaY<0?1.1:1/1.1),e.clientX-b.left,e.clientY-b.top);
},{passive:false});

// ===== Chụm 2 ngón: chỉ kéo giãn hình bằng GPU, nhấc tay mới đổi cỡ thật và vẽ rõ nét =====
(function(){
 let pz=null,raf=0;
 const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
 const mid=e=>{const b=stage.getBoundingClientRect();return[(e.touches[0].clientX+e.touches[1].clientX)/2-b.left,(e.touches[0].clientY+e.touches[1].clientY)/2-b.top]};
 stage.addEventListener('touchstart',e=>{
  if(e.touches.length!==2||!pages.length)return;
  e.preventDefault();
  const [cx,cy]=mid(e);
  pz={d:dist(e),s:scale,cx,cy,f:1};
  pgs.style.transformOrigin=(stage.scrollLeft+cx-pgs.offsetLeft)+'px '+(stage.scrollTop+cy-pgs.offsetTop)+'px';
  pgs.style.willChange='transform';
 },{passive:false});
 stage.addEventListener('touchmove',e=>{
  if(!pz||e.touches.length!==2)return;
  e.preventDefault();
  pz.f=Math.min(4/pz.s,Math.max(.3/pz.s,dist(e)/pz.d));
  if(!raf)raf=requestAnimationFrame(()=>{raf=0;if(pz)pgs.style.transform='scale('+pz.f+')'});
 },{passive:false});
 const end=e=>{
  if(!pz||e.touches.length>=2)return;
  const p=pz;pz=null;
  pgs.style.transform='';pgs.style.willChange='';
  setScale(p.s*p.f,p.cx,p.cy);
 };
 stage.addEventListener('touchend',end);stage.addEventListener('touchcancel',end);
})();

function buildList(){
 const L=$('list');L.innerHTML='';
 $('ah').textContent=names.length?`Danh sách audio (${names.filter(n=>marks[n]).length}/${names.length} có vị trí)`:'Danh sách audio';
 names.forEach(n=>{
  const d=document.createElement('div');
  d.className='it'+(marks[n]?' has':'')+(n===cur?' cur':'');
  d.innerHTML='<span class="d"></span><span></span><span class="pg"></span>';
  d.children[1].textContent=n;
  if(marks[n])d.children[2].textContent='tr.'+marks[n].page;
  d.onclick=()=>{cur=n;if(marks[n])goPage(marks[n].page);play(n);buildList()};
  L.appendChild(d);
 });
 drawMarks();
}
function drawMarks(){
 pages.forEach(P=>P.ov.innerHTML='');
 names.forEach(n=>{
  const m=marks[n];if(!m||!pages[m.page-1])return;
  const e=document.createElement('div');
  e.className='mk'+(playing===n&&!au.paused?' pl':'');
  e.style.left=m.x+'%';e.style.top=m.y+'%';
  e.innerHTML='🔊<small></small>';e.querySelector('small').textContent=n.replace(/\.[^.]+$/,'');
  e.onclick=ev=>{ev.stopPropagation();cur=n;play(n)};
  pages[m.page-1].ov.appendChild(e);
 });
}

let playTok=0;
async function play(n){
 const f=files.get(n);if(!f)return;
 if(playing===n){au.paused?au.play():au.pause();return}
 const tk=++playTok;let blob=f;
 if(f.zip){
  try{blob=await zipBlob(f)}catch(e){toast('Không đọc được '+n+': '+(e.message||e));return}
  if(tk!==playTok)return;
 }
 if(au.src&&au.src.startsWith('blob:'))URL.revokeObjectURL(au.src);
 au.src=URL.createObjectURL(blob);playing=n;
 au.play().catch(()=>{});
}
// iOS/Android chỉ cho phát tiếng sau lần chạm đầu tiên: phát một đoạn im lặng để "mở khoá" thẻ audio
const SIL='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
let unlocked=false;
function unlock(){if(unlocked)return;unlocked=true;try{au.loop=false;au.src=SIL;au.play().catch(()=>{})}catch(e){}}
['click','touchend','pointerup'].forEach(ev=>document.addEventListener(ev,unlock,{capture:true}));
['play','pause','ended'].forEach(ev=>au.addEventListener(ev,drawMarks));
document.addEventListener('keydown',e=>{if(e.code==='Space'&&playing){e.preventDefault();au.paused?au.play():au.pause()}});

async function loadPdf(f){
 await workerReady;
 pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
 await buildPages();
}
function refreshNames(){names=[...files.keys()].sort(nat);if(!cur||!files.has(cur))cur=names[0]||null}
async function openMany(list){
 const arr=[...list];if(!arr.length)return;
 const pdfF=arr.find(f=>/\.pdf$/i.test(f.name)||f.type==='application/pdf');
 const zips=arr.filter(f=>/\.zip$/i.test(f.name)||/zip/.test(f.type));
 const js=arr.find(f=>/\.json$/i.test(f.name)||f.type==='application/json');
 const aud=arr.filter(f=>AUD.test(f.name)||f.type.startsWith('audio/'));
 const got=[];
 try{
  if(pdfF){toast('Đang mở PDF…',0);marks={};await loadPdf(pdfF);got.push('PDF '+pdf.numPages+' trang')}
  if(zips.length||aud.length){
   toast('Đang đọc audio…',0);
   for(const z of zips){const m=await readZip(z);m.forEach((v,k)=>files.set(k,v))}
   for(const f of aud)files.set(f.name.normalize('NFC'),f);
   refreshNames();got.push(names.length+' bài audio');
  }
  if(js){
   let o=JSON.parse(await js.text());o=o.marks||o;
   const nm={};
   for(const [k,v] of Object.entries(o))if(v&&v.page)nm[k.normalize('NFC')]=v;
   marks=nm;got.push(Object.keys(nm).length+' liên kết');
  }
  buildList();
  if(js&&pdf){const ps=Object.values(marks).map(m=>m.page);if(ps.length)goPage(Math.min(...ps))}
  let msg='Đã nạp: '+got.join(' · ');
  const miss=Object.keys(marks).filter(n=>!files.has(n)).length;
  if(js&&files.size&&miss)msg+=' ('+miss+' liên kết không thấy audio cùng tên)';
  toast(msg,8000);
 }catch(err){toast('Lỗi: '+(err.message||err),0)}
}
$('bAll').onclick=()=>$('fm').click();
$('fm').onchange=async e=>{const l=[...e.target.files];e.target.value='';await openMany(l)};
$('bMenu').onclick=()=>document.body.classList.toggle('list');
$('list').addEventListener('click',e=>{if(e.target.closest('.it'))document.body.classList.remove('list')});
document.addEventListener('pointerdown',e=>{
 if(document.body.classList.contains('list')&&!e.target.closest('aside')&&!e.target.closest('#bMenu'))document.body.classList.remove('list');
},true);
</script>
</body>
</html>
